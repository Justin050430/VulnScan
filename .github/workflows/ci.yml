name: VulnScan CI

# Pull requests are gated here; direct pushes to `main` are tested and
# deployed by the "Deploy to Azure App Service" workflow (deploy.yml).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run VulnScan test suite
        # The suite uses an in-memory SQLite database and controlled local
        # targets; MSSQL integration tests skip automatically when no SQL
        # Server instance is available on the runner.
        run: python -m pytest testing -q --junitxml=testing/results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: testing/results.xml
          if-no-files-found: warn
